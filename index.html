<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnality - Émissions & Antenne</title>
    <!-- SDK officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { color: #ff0055; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .badge { background-color: #ff0055; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .id-tag { color: #888; font-size: 0.8rem; font-family: monospace; }
        p { color: #ccc; font-size: 0.95rem; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>📺 Réseau Furnality — Catalogue des Émissions</h1>
    <div id="shows-container" class="grid">Chargement des données en cours...</div>

    <script>
        // Configuration de la connexion Supabase
        const SUPABASE_URL = "https://qsqenkvrerrbzibkjoml.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FLqzd6wXyc5e_veOYAVN9g_AXBaGASo";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadShows() {
            const container = document.getElementById('shows-container');

            // Interrogation de la table 'shows'
            const { data: shows, error } = await supabaseClient
                .from('shows')
                .select('*');

            if (error) {
                console.error("Erreur d'accès à la BDD :", error);
                container.innerHTML = "<p style='color:red;'>Impossible de charger les données.</p>";
                return;
            }

            container.innerHTML = ""; // Vidage du message de chargement

            shows.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="badge">${show.category || 'Général'}</span>
                    <h3>${show.title}</h3>
                    <p>${show.description}</p>
                    <div class="id-tag">ID: ${show.id} | Canal ID: ${show.broadcast_id}</div>
                `;
                container.appendChild(card);
            });
        }

        loadShows();
    </script>
</body>
</html>
