<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnality - Émissions & Antenne</title>
    <!-- SDK officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; }
        h1 { color: #ff0055; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Conteneur des filtres */
        .filter-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .filter-btn { background-color: #1e1e1e; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        .filter-btn:hover { background-color: #2a2a2a; color: #fff; }
        .filter-btn.active { background-color: #ff0055; color: #fff; border-color: #ff0055; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { background-color: #ff0055; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .channel-tag { font-size: 0.85rem; font-weight: bold; color: #888; background: #2a2a2a; padding: 3px 8px; border-radius: 4px; }
        
        .card-body h3 { margin: 0 0 10px 0; color: #fff; }
        .card-body p { color: #ccc; font-size: 0.95rem; line-height: 1.4; margin: 0; }
        
        .card-footer { margin-top: 15px; padding-top: 10px; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
        .id-tag { color: #666; font-size: 0.75rem; font-family: monospace; }
        .media-type { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .media-tv { background-color: #007bc4; color: #fff; }
        .media-radio { background-color: #e67e22; color: #fff; }
    </style>
</head>
<body>

    <h1>📺 Réseau Furnality — Catalogue des Émissions</h1>

    <!-- Boutons de filtre -->
    <div class="filter-container">
        <button class="filter-btn active" onclick="filterShows('all', this)">Toutes les émissions</button>
        <button class="filter-btn" onclick="filterShows('tv', this)">📺 Télévision</button>
        <button class="filter-btn" onclick="filterShows('radio', this)">📻 Radio</button>
    </div>

    <div id="shows-container" class="grid">Chargement des données en cours...</div>

    <script>
        const SUPABASE_URL = "https://qsqenkvrerrbzibkjoml.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FLqzd6wXyc5e_veOYAVN9g_AXBaGASo";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allShows = []; // Stockage local des données chargées

        async function loadShows() {
            const container = document.getElementById('shows-container');

            // Jointure entre 'shows' et la table 'broadcast' grâce à la clé étrangère
            const { data: shows, error } = await supabaseClient
                .from('shows')
                .select(`
                    *,
                    broadcast (
                        name,
                        broadcast_type
                    )
                `);

            if (error) {
                console.error("Erreur d'accès à la BDD :", error);
                container.innerHTML = "<p style='color:red;'>Impossible de charger les données.</p>";
                return;
            }

            allShows = shows; // Sauvegarde des émissions dans la variable globale
            renderShows(allShows); // Affichage initial
        }

        function renderShows(showsToDisplay) {
            const container = document.getElementById('shows-container');
            container.innerHTML = "";

            if (showsToDisplay.length === 0) {
                container.innerHTML = "<p style='color:#888;'>Aucune émission trouvée pour cette catégorie.</p>";
                return;
            }

            showsToDisplay.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';

                // Récupération des infos de la chaîne liée
                const channelName = show.broadcast ? show.broadcast.name : 'Inconnu';
                const mediaType = show.broadcast ? show.broadcast.broadcast_type : 'tv';

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge">${show.category || 'Général'}</span>
                            <span class="channel-tag">${channelName}</span>
                        </div>
                        <div class="card-body">
                            <h3>${show.title}</h3>
                            <p>${show.description}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="id-tag">ID: ${show.id}</span>
                        <span class="media-type ${mediaType === 'radio' ? 'media-radio' : 'media-tv'}">${mediaType === 'radio' ? '📻 Radio' : '📺 TV'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterShows(type, btnElement) {
            // Mettre à jour l'état visuel des boutons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (type === 'all') {
                renderShows(allShows);
            } else {
                const filtered = allShows.filter(show => show.broadcast && show.broadcast.broadcast_type === type);
                renderShows(filtered);
            }
        }

        loadShows();
    </script>
</body>
</html>
