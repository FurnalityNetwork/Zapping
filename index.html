<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnality Zapping — Replay & Streaming</title>
    <!-- SDK officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Polices Caledonian */
        @font-face {
            font-family: 'Caledonian';
            src: url('./Assets/fonts/Caledonian_Font/Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Caledonian';
            src: url('./Assets/fonts/Caledonian_Font/Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --bg-main: #ffffff;
            --bg-card: #f8f9fa;
            --border-light: #e5e7eb;
            --text-main: #0a0a0a;
            --text-muted: #525252;
            --accent-black: #000000;
            --font-main: 'Caledonian', Georgia, serif, system-ui;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }
        
        /* Navbar Header Style OBC avec tes SVGs */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-light);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-box img {
            height: 26px;
            object-fit: contain;
        }

        .logo-separator {
            color: var(--border-light);
            font-size: 1.2rem;
            font-weight: 300;
        }

        .main-content { 
            flex: 1; 
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        h1 { 
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-black); 
            border-bottom: 1px solid var(--border-light); 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
            letter-spacing: -0.5px;
        }
        
        /* Filtres Minimalistes */
        .filter-container { display: flex; gap: 10px; margin-bottom: 30px; }
        .filter-btn { 
            background-color: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border-light); 
            padding: 8px 18px; 
            font-family: var(--font-main);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        .filter-btn:hover, .filter-btn.active { 
            background-color: var(--accent-black); 
            color: #ffffff; 
            border-color: var(--accent-black); 
        }

        /* Grille des cartes Émissions */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .card { 
            background-color: var(--bg-main); 
            border: 1px solid var(--border-light); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .badge { 
            background-color: var(--accent-black); 
            color: #fff; 
            padding: 3px 8px; 
            font-size: 0.7rem; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }
        
        .channel-logo-container { height: 28px; display: flex; align-items: center; }
        .channel-logo-container img { height: 28px; max-width: 100px; object-fit: contain; }
        .channel-tag { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); background: var(--bg-card); padding: 4px 8px; border: 1px solid var(--border-light); }
        
        .card-body h3 { margin: 0 0 8px 0; color: var(--text-main); font-size: 1.2rem; }
        .card-body p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin: 0; }
        
        .card-footer { 
            margin-top: 20px; 
            padding-top: 12px; 
            border-top: 1px solid var(--border-light); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .id-tag { color: #999; font-size: 0.75rem; font-family: monospace; }
        .media-type { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; font-weight: bold; }
        .media-tv { background-color: #000; color: #fff; }
        .media-radio { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-light); }

        /* Footer Dynamique Éditorial */
        footer { 
            margin-top: 60px; 
            background-color: var(--bg-main); 
            border-top: 1px solid var(--border-light); 
            padding: 40px 20px; 
        }
        .footer-grid { 
            max-width: 1400px;
            margin: 0 auto;
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 30px; 
        }
        .footer-col h4 { 
            color: var(--accent-black); 
            margin-top: 0; 
            margin-bottom: 15px; 
            font-size: 0.9rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .footer-col ul { list-style: none; padding: 0; margin: 0; }
        .footer-col li { margin-bottom: 8px; }
        .footer-col a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
        .footer-col a:hover { color: var(--accent-black); text-decoration: underline; }
        .footer-bottom { margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-light); text-align: center; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Header avec tes SVGs -->
    <header class="navbar">
        <div class="logo-box">
            <img src="Assets/images/Furnality Logo.svg" alt="Furnality" onerror="this.style.display='none'">
            <span class="logo-separator">|</span>
            <img src="Assets/images/ZAPPING.svg" alt="Zapping" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="main-content">
        <h1>Catalogue des Émissions & Replays</h1>

        <!-- Filtres -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterShows('all', this)">Toutes les émissions</button>
            <button class="filter-btn" onclick="filterShows('tv', this)">📺 Télévision</button>
            <button class="filter-btn" onclick="filterShows('radio', this)">📻 Radio</button>
        </div>

        <div id="shows-container" class="grid">Chargement des émissions...</div>
    </div>

    <!-- Footer Dynamique -->
    <footer>
        <div id="footer-links-container" class="footer-grid">Chargement du pied de page...</div>
        <div class="footer-bottom">
            &copy; 2026 Furnality Group — Tous droits réservés.
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://qsqenkvrerrbzibkjoml.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FLqzd6wXyc5e_veOYAVN9g_AXBaGASo";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allShows = [];

        async function initApp() {
            const [showsRes, broadcastRes, footerRes] = await Promise.all([
                supabaseClient.from('shows').select('*'),
                supabaseClient.from('broadcast').select('*'),
                supabaseClient.from('footer_links').select('*').order('order_index', { ascending: true })
            ]);

            if (showsRes.data && broadcastRes.data) {
                const broadcastMap = {};
                broadcastRes.data.forEach(b => { broadcastMap[b.id] = b; });

                allShows = showsRes.data.map(show => ({
                    ...show,
                    broadcast: broadcastMap[show.broadcast_id] || null
                }));

                renderShows(allShows);
            } else {
                document.getElementById('shows-container').innerHTML = "<p style='color:red;'>Erreur lors du chargement des émissions.</p>";
            }

            if (footerRes.data) {
                renderFooter(footerRes.data);
            } else {
                document.getElementById('footer-links-container').innerHTML = "<p style='color:#666;'>Liens indisponibles.</p>";
            }
        }

        function renderShows(showsToDisplay) {
            const container = document.getElementById('shows-container');
            container.innerHTML = "";

            if (showsToDisplay.length === 0) {
                container.innerHTML = "<p style='color:#888;'>Aucune émission trouvée pour cette catégorie.</p>";
                return;
            }

            showsToDisplay.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';

                const channelName = show.broadcast ? show.broadcast.name : 'Canal ' + show.broadcast_id;
                const logoUrl = show.broadcast ? show.broadcast.logo_url : null;
                const mediaType = show.broadcast ? (show.broadcast.broadcast_type || (show.broadcast_id >= 100 ? 'radio' : 'tv')) : 'tv';

                const logoHtml = logoUrl 
                    ? `<img src="${logoUrl}" alt="${channelName}" onerror="this.outerHTML='<span class=\\'channel-tag\\'>${channelName}</span>'">` 
                    : `<span class="channel-tag">${channelName}</span>`;

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge">${show.category || 'Général'}</span>
                            <div class="channel-logo-container">${logoHtml}</div>
                        </div>
                        <div class="card-body">
                            <h3>${show.title}</h3>
                            <p>${show.description}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="id-tag">ID: ${show.id}</span>
                        <span class="media-type ${mediaType === 'radio' ? 'media-radio' : 'media-tv'}">${mediaType === 'radio' ? 'Radio' : 'TV'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFooter(links) {
            const container = document.getElementById('footer-links-container');
            container.innerHTML = "";

            if (links.length === 0) {
                container.innerHTML = "<p style='color:#666;'>Aucun lien configuré.</p>";
                return;
            }

            const categories = {};
            links.forEach(link => {
                const cat = link.category || 'Général';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(link);
            });

            Object.keys(categories).forEach(catName => {
                const col = document.createElement('div');
                col.className = 'footer-col';
                
                let linksList = categories[catName].map(l => 
                    `<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`
                ).join('');

                col.innerHTML = `
                    <h4>${catName}</h4>
                    <ul>${linksList}</ul>
                `;
                container.appendChild(col);
            });
        }

        function filterShows(type, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (type === 'all') {
                renderShows(allShows);
            } else {
                const filtered = allShows.filter(show => {
                    const mediaType = show.broadcast ? (show.broadcast.broadcast_type || (show.broadcast_id >= 100 ? 'radio' : 'tv')) : (show.broadcast_id >= 100 ? 'radio' : 'tv');
                    return mediaType === type;
                });
                renderShows(filtered);
            }
        }

        initApp();
    </script>
</body>
</html>
