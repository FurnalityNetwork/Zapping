<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furnality - Émissions & Antenne</title>
    <!-- SDK officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content { flex: 1; }

        h1 { color: #ff0055; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Conteneur des filtres */
        .filter-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .filter-btn { background-color: #1e1e1e; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: all 0.2s ease; }
        .filter-btn:hover { background-color: #2a2a2a; color: #fff; }
        .filter-btn.active { background-color: #ff0055; color: #fff; border-color: #ff0055; }

        /* Grille des cartes */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { background-color: #ff0055; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        
        /* Ajustement des logos à 30px */
        .channel-logo-container { height: 30px; display: flex; align-items: center; }
        .channel-logo-container img { height: 30px; max-width: 120px; object-fit: contain; }
        .channel-tag { font-size: 0.85rem; font-weight: bold; color: #888; background: #2a2a2a; padding: 4px 8px; border-radius: 4px; }
        
        .card-body h3 { margin: 0 0 10px 0; color: #fff; }
        .card-body p { color: #ccc; font-size: 0.95rem; line-height: 1.4; margin: 0; }
        
        .card-footer { margin-top: 15px; padding-top: 10px; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
        .id-tag { color: #666; font-size: 0.75rem; font-family: monospace; }
        .media-type { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .media-tv { background-color: #007bc4; color: #fff; }
        .media-radio { background-color: #e67e22; color: #fff; }

        /* Style du Footer Dynamique */
        footer { 
            margin-top: 50px; 
            background-color: #181818; 
            border-top: 1px solid #2a2a2a; 
            padding: 30px 20px; 
            border-radius: 8px; 
        }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .footer-col h4 { color: #ff0055; margin-top: 0; margin-bottom: 12px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .footer-col ul { list-style: none; padding: 0; margin: 0; }
        .footer-col li { margin-bottom: 8px; }
        .footer-col a { color: #aaa; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .footer-col a:hover { color: #fff; text-decoration: underline; }
        .footer-bottom { margin-top: 25px; padding-top: 15px; border-top: 1px solid #222; text-align: center; color: #666; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="main-content">
        <h1>📺 Réseau Furnality — Catalogue des Émissions</h1>

        <!-- Filtres -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterShows('all', this)">Toutes les émissions</button>
            <button class="filter-btn" onclick="filterShows('tv', this)">📺 Télévision</button>
            <button class="filter-btn" onclick="filterShows('radio', this)">📻 Radio</button>
        </div>

        <div id="shows-container" class="grid">Chargement des émissions...</div>
    </div>

    <!-- Footer Dynamique -->
    <footer>
        <div id="footer-links-container" class="footer-grid">Chargement du pied de page...</div>
        <div class="footer-bottom">
            &copy; 2026 Furnality Group — Tous droits réservés.
        </div>
    </footer>

    <script>
        const SUPABASE_URL = "https://qsqenkvrerrbzibkjoml.supabase.co";
        const SUPABASE_KEY = "sb_publishable_FLqzd6wXyc5e_veOYAVN9g_AXBaGASo";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allShows = [];

        async function initApp() {
            // Chargement des données en parallèle (shows, broadcast, footer_links)
            const [showsRes, broadcastRes, footerRes] = await Promise.all([
                supabaseClient.from('shows').select('*'),
                supabaseClient.from('broadcast').select('*'),
                supabaseClient.from('footer_links').select('*').order('order_index', { ascending: true })
            ]);

            if (showsRes.data && broadcastRes.data) {
                const broadcastMap = {};
                broadcastRes.data.forEach(b => { broadcastMap[b.id] = b; });

                allShows = showsRes.data.map(show => ({
                    ...show,
                    broadcast: broadcastMap[show.broadcast_id] || null
                }));

                renderShows(allShows);
            } else {
                document.getElementById('shows-container').innerHTML = "<p style='color:red;'>Erreur lors du chargement des émissions.</p>";
            }

            // Traitement du Footer
            if (footerRes.data) {
                renderFooter(footerRes.data);
            } else {
                document.getElementById('footer-links-container').innerHTML = "<p style='color:#666;'>Liens indisponibles.</p>";
            }
        }

        function renderShows(showsToDisplay) {
            const container = document.getElementById('shows-container');
            container.innerHTML = "";

            if (showsToDisplay.length === 0) {
                container.innerHTML = "<p style='color:#888;'>Aucune émission trouvée pour cette catégorie.</p>";
                return;
            }

            showsToDisplay.forEach(show => {
                const card = document.createElement('div');
                card.className = 'card';

                const channelName = show.broadcast ? show.broadcast.name : 'Canal ' + show.broadcast_id;
                const logoUrl = show.broadcast ? show.broadcast.logo_url : null;
                const mediaType = show.broadcast ? (show.broadcast.broadcast_type || (show.broadcast_id >= 100 ? 'radio' : 'tv')) : 'tv';

                // Logo 30px avec secours en texte
                const logoHtml = logoUrl 
                    ? `<img src="${logoUrl}" alt="${channelName}" onerror="this.outerHTML='<span class=\\'channel-tag\\'>${channelName}</span>'">` 
                    : `<span class="channel-tag">${channelName}</span>`;

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="badge">${show.category || 'Général'}</span>
                            <div class="channel-logo-container">${logoHtml}</div>
                        </div>
                        <div class="card-body">
                            <h3>${show.title}</h3>
                            <p>${show.description}</p>
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="id-tag">ID: ${show.id}</span>
                        <span class="media-type ${mediaType === 'radio' ? 'media-radio' : 'media-tv'}">${mediaType === 'radio' ? '📻 Radio' : '📺 TV'}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFooter(links) {
            const container = document.getElementById('footer-links-container');
            container.innerHTML = "";

            if (links.length === 0) {
                container.innerHTML = "<p style='color:#666;'>Aucun lien configuré.</p>";
                return;
            }

            // Regroupement des liens par catégorie
            const categories = {};
            links.forEach(link => {
                const cat = link.category || 'Général';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(link);
            });

            // Affichage par colonne pour chaque catégorie
            Object.keys(categories).forEach(catName => {
                const col = document.createElement('div');
                col.className = 'footer-col';
                
                let linksList = categories[catName].map(l => 
                    `<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`
                ).join('');

                col.innerHTML = `
                    <h4>${catName}</h4>
                    <ul>${linksList}</ul>
                `;
                container.appendChild(col);
            });
        }

        function filterShows(type, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (type === 'all') {
                renderShows(allShows);
            } else {
                const filtered = allShows.filter(show => {
                    const mediaType = show.broadcast ? (show.broadcast.broadcast_type || (show.broadcast_id >= 100 ? 'radio' : 'tv')) : (show.broadcast_id >= 100 ? 'radio' : 'tv');
                    return mediaType === type;
                });
                renderShows(filtered);
            }
        }

        initApp();
    </script>
</body>
</html>
